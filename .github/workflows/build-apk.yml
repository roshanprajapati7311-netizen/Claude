name: Build Kaivra APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Keeps the same signing key between builds, so updates install over the old app
      - name: Reuse signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kaivra-debug-keystore-v1

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Kaivra-v0.1.${{ github.run_number }}.apk"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kaivra-build-${{ github.run_number }}
          name: Kaivra v0.1.${{ github.run_number }}
          make_latest: true
          body: |
            Download the APK below on your phone, open it, and allow "Install unknown apps" if Android asks.
            Built from commit ${{ github.sha }}.
          files: dist/*.apk
